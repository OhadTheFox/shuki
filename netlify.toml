# Netlify: public/ is the site, /api/* and /mcp/* go to netlify/functions/shuki.mjs. See the README ("Vercel / Netlify").
[build]
  publish = "public"
  command = ""

[functions]
  node_bundler = "esbuild"
  included_files = ["migrations/**", "worker/**"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
