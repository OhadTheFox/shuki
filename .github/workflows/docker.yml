# A ready Docker image on GitHub's registry (ghcr.io/<owner>/shuki), for installing without the code.
# GitHub only accepts workflow files from a token with the "workflow" permission, so add this one by hand:
# GitHub → the repository → Add file → Create new file → .github/workflows/docker.yml → paste this file.
# It builds on every release tag (v0.21.0...) and when run by hand (Actions → docker → Run workflow).
name: docker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # arm64 too: Raspberry Pi, NAS, Apple silicon
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shuki
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
