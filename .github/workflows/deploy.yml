# Deploys Shuki to Cloudflare from GitHub. Lives at .github/workflows/deploy.yml; the steps are in tools/ci-deploy.sh.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Optional: ANTHROPIC_API_KEY or OPENAI_API_KEY (or enter a key in the app),
# VAPID_PRIVATE_JWK (or the server makes push keys), SETUP_CODE (8 digits; recommended when the repo is public).
# Runs on every push to main. In a private repo a new house gets its one-time setup code in the run summary, and
# "Run workflow" with a name from the house prints a pairing code. A public repo never prints codes (its logs are public).
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      invite:
        description: 'Pairing code for (a name from the house), empty = just deploy'
        required: false
        default: ''
permissions:
  contents: read
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: bash tools/ci-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
          INVITE: ${{ github.event.inputs.invite }}
